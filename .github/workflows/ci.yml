name: CI (build)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure host tests
        run: cmake -S test -B build/host-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build host tests
        run: cmake --build build/host-tests --parallel 2

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

  build:
    # Never run untrusted fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, crossink-build]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify PlatformIO Core
        run: pio --version

      - name: Build CrossInk production variants
        run: |
          set -euo pipefail
          pio run -e default | tee pio-default.log
          pio run -e tiny | tee pio-tiny.log
          pio run -e xlarge | tee pio-xlarge.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## Firmware build stats"
            for environment in default tiny xlarge; do
              echo "### ${environment}"
              grep -E "RAM:\s|Flash:\s" "pio-${environment}.log" | while read -r line; do echo "- ${line}"; done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-production
          path: |
            .pio/build/default/firmware-default.bin
            .pio/build/tiny/firmware-tiny.bin
            .pio/build/xlarge/firmware-xlarge.bin
          if-no-files-found: error

  qemu-tracer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-qemu-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-qemu-platformio-

      - name: Install pinned PlatformIO Core
        run: python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Verify QEMU targets cannot flash hardware
        run: python scripts/verify_qemu_no_flash.py --pio pio

      - name: Run QEMU host contract tests
        run: python -m unittest discover -s test/qemu -p "test_*.py" -v

      - name: Install pinned ESP32-C3 QEMU
        run: python scripts/install_qemu_esp32c3.py

      - name: Build ESP32-C3 QEMU image
        run: pio run -e qemu-esp32c3 -t qemu-image

      - name: Run ESP32-C3 full acceptance
        run: python scripts/run_qemu_esp32c3.py --expect QEMU_TEST_PASS --timeout 300 --log .pio/build/qemu-esp32c3/qemu-full-acceptance.log

      - name: Verify ESP32-C3 resource budget
        run: python scripts/check_qemu_resources.py verify --baseline test/qemu/baselines/esp32c3-55.03.37-arduino-3.3.7.json --manifest .pio/build/qemu-esp32c3/qemu_manifest.json --elf .pio/build/qemu-esp32c3/firmware.elf --runtime-log .pio/build/qemu-esp32c3/qemu-full-acceptance.log

      - name: Upload full acceptance log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-esp32c3-full-acceptance
          path: .pio/build/qemu-esp32c3/qemu-full-acceptance.log
          if-no-files-found: warn

  pdf-simulator-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build and self-test pinned native simulator image
        run: python scripts/run_pdf_simulator_container.py --build

      - name: Run real-activity PDF simulator acceptance
        run: python scripts/run_pdf_simulator_acceptance.py --container --headless --timeout 240

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - host-tests
      - pdf-simulator-acceptance
      - qemu-tracer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
